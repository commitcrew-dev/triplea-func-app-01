name: Build and deploy Node.js project to Azure Function App - triplea-func-app-01

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - '**.md'
      - 'samples/**'
  pull_request:
    branches:
      - 'master'
    paths-ignore:
      - '**.md'
      - 'samples/**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'
  NODE_VERSION: '22.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read 

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/package-lock.json'

      - name: 'Install, build'
        shell: bash
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: |
          npm ci
          npm run build

      - name: 'Remove dev dependencies'
        shell: bash
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: npm prune --omit=dev

      - name: Zip artifact for deployment
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: zip -r "$GITHUB_WORKSPACE/release.zip" dist node_modules host.json package.json

      - name: Upload artifact for deployment job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: |
          unzip -q release.zip
          rm release.zip
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BDAB4CE88D3C42CABD106AEC78B4A71E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_404B8AB0D0BB409582648C3CB3FE1DE2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1EF332C186A84E2EB5F9337071B57DBD }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'triplea-func-app-01'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      # Fails the run if the deployed app doesn't answer; retries cover cold start.
      - name: Smoke test
        if: steps.fa.outputs.app-url != ''
        run: |
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 10 --retry-all-errors \
            "${{ steps.fa.outputs.app-url }}/api/hello?name=ci"
